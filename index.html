<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Student Portfolio Hub</title>
    <meta name="description" content="Student showcase with dynamic tabs for projects, certifications and skills.">

    <!-- Tailwind CSS (CDN, same as course practicals) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <style>
        .tab-panel { animation: fade .25s ease; }
        @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .bar-fill { transition: width .8s ease; }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

    <!-- ============ HEADER / PROFILE ============ -->
    <header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white">
        <div class="max-w-5xl mx-auto px-4 py-8 flex flex-col sm:flex-row items-center gap-5">
            <div id="avatar"
                 class="w-24 h-24 rounded-full bg-white/20 border-4 border-white/60 flex items-center justify-center text-4xl font-bold shrink-0">
            </div>
            <div class="text-center sm:text-left flex-1">
                <h1 id="studentName" class="text-3xl font-bold"></h1>
                <p id="studentRole" class="text-indigo-100 mt-1"></p>
                <p id="studentBio" class="text-sm text-indigo-100/90 mt-2 max-w-xl"></p>
            </div>
            <button id="themeToggle" type="button"
                    class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded text-sm self-start"
                    aria-label="Toggle dark mode">
                🌙 Dark
            </button>
        </div>

        <!-- Quick stats -->
        <div class="max-w-5xl mx-auto px-4 pb-6 grid grid-cols-3 gap-3 text-center">
            <div class="bg-white/15 rounded p-3"><p id="statProjects" class="text-2xl font-bold">0</p><p class="text-xs uppercase tracking-wide">Projects</p></div>
            <div class="bg-white/15 rounded p-3"><p id="statCerts" class="text-2xl font-bold">0</p><p class="text-xs uppercase tracking-wide">Certifications</p></div>
            <div class="bg-white/15 rounded p-3"><p id="statSkills" class="text-2xl font-bold">0</p><p class="text-xs uppercase tracking-wide">Skills</p></div>
        </div>
    </header>

    <!-- ============ TABS ============ -->
    <main class="max-w-5xl mx-auto w-full px-4 py-6 flex-1">

        <div id="tabList" role="tablist" aria-label="Portfolio sections"
             class="flex gap-2 border-b border-gray-300 dark:border-slate-700 mb-6 overflow-x-auto">
            <!-- buttons generated by script.js -->
        </div>

        <section id="tabPanel" role="tabpanel" class="tab-panel"></section>
    </main>

    <footer class="text-center text-xs text-gray-500 dark:text-slate-400 py-4">
        <span id="footerText"></span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
